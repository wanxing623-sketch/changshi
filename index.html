<!doctype html>
<html lang="zh-CN" data-theme="light" data-font="std">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f3ed">
  <meta name="description" content="识陷：离线可用的公考政治理论训练，包含单选、组合、判断、数字填空、间隔复习与本地学习统计。">
  <meta name="color-scheme" content="light dark">
  <title>识陷 · 公考政治理论训练</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="#home" data-page="home" aria-label="识陷，回到学习概览">
        <span class="brand-mark" aria-hidden="true">识</span>
        <span class="brand-text"><strong>识陷</strong><small>公考政治理论训练</small></span>
      </a>
      <div class="top-actions">
        <span class="offline-state" id="offlineState" aria-live="polite"><i></i>离线可用</span>
        <button class="icon-button" id="fontBtn" data-action="font" type="button" title="放大字号" aria-label="放大字号">字</button>
        <button class="icon-button" id="themeBtn" data-action="theme" type="button" title="切换深色模式" aria-label="切换深色模式">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.2 15.3A8.5 8.5 0 0 1 8.7 3.8 8.5 8.5 0 1 0 20.2 15.3Z"/></svg>
        </button>
      </div>
    </header>

    <main id="main" class="main-content" tabindex="-1">
      <div id="content"></div>
    </main>

    <footer class="site-footer">
      <span>学习记录只保存在本机</span>
      <span>理论表述请以权威原文为准</span>
    </footer>

    <nav class="bottom-nav" aria-label="主导航">
      <button class="nav-item active" data-page="home" type="button" aria-current="page">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 10.5 12 3.8l8.5 6.7v9.2a.8.8 0 0 1-.8.8h-5.1v-6.1H9.4v6.1H4.3a.8.8 0 0 1-.8-.8z"/></svg>
        <span>概览</span>
      </button>
      <button class="nav-item" data-page="practice" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5v2M12 18.5v2M3.5 12h2M18.5 12h2M6 6l1.4 1.4m9.2 9.2L18 18m0-12-1.4 1.4m-9.2 9.2L6 18"/><circle cx="12" cy="12" r="5"/></svg>
        <span>练习</span>
      </button>
      <button class="nav-item" data-page="mistakes" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4.5h12a1 1 0 0 1 1 1v14l-7-3.5-7 3.5v-14a1 1 0 0 1 1-1Z"/><path d="M9 8.5h6M9 11.5h6"/></svg>
        <span>错题</span><b id="navMistakes" class="nav-count" hidden>0</b>
      </button>
      <button class="nav-item" data-page="guide" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 5.5h6a3 3 0 0 1 3 3v11a3 3 0 0 0-3-3h-6zM19.5 5.5h-3a3 3 0 0 0-3 3v11a3 3 0 0 1 3-3h3z"/><path d="M7 9h3M7 12h3M16 9h1"/></svg>
        <span>资料</span>
      </button>
    </nav>
  </div>

  <noscript><p class="noscript">此练习页需要启用 JavaScript。</p></noscript>
  <script src="data/questions.js"></script>
  <script src="data/questions-extra.js"></script>
  <script src="data/questions-mix.js"></script>
  <script src="data/recite.js"></script>
  <script src="data/traps.js"></script>
  <script src="data/timeline.js"></script>
  <script src="app.js"></script>
</body>
</html>
